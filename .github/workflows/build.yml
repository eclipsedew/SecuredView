name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Stamp build number into app_version.dart
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/app_version.dart")
          text = p.read_text()
          import re
          build = "${{ github.run_number }}"
          text = re.sub(r"const int kBuildNumber = \d+;", f"const int kBuildNumber = {build};", text)
          p.write_text(text)
          print(p.read_text())
          PY
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux/x64/release/bundle/

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Stamp build number into app_version.dart
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("lib/app_version.dart")
          text = p.read_text()
          build = "${{ github.run_number }}"
          text = re.sub(r"const int kBuildNumber = \d+;", f"const int kBuildNumber = {build};", text)
          p.write_text(text)
          print(p.read_text())
          PY
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Build usque.exe (MASQUE)
        shell: bash
        run: |
          git clone https://github.com/justinwoo280/usque.git usque-src
          git -C usque-src checkout db42acb8ee902daba516e765321aa279a57fc2db
          cd usque-src
          CGO_ENABLED=0 go build -ldflags="-s -w" -o "$GITHUB_WORKSPACE/windows/bundled/usque.exe" .
          ls -la "$GITHUB_WORKSPACE/windows/bundled/usque.exe"
      - run: flutter build windows --release
        env:
          # Avoid flaky LNK1327 (mt.exe) on shared runners when possible
          FLUTTER_VERBOSITY: warning
      - name: Ensure usque.exe is in Release folder
        shell: bash
        run: |
          mkdir -p build/windows/x64/runner/Release
          cp -f windows/bundled/usque.exe build/windows/x64/runner/Release/usque.exe
      - name: Download VC++ Redistributable
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "vc_redist.x64.exe"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            build/windows/x64/runner/Release/
            vc_redist.x64.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Restore release keystore (required for updatable signatures)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret missing — release would fall back to a random debug key and break updates"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release-key.jks\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
            > android/key.properties
          echo "key.properties ready (alias=${ANDROID_KEY_ALIAS})"
      - name: Stamp build number into app_version.dart
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/app_version.dart")
          text = p.read_text()
          import re
          build = "${{ github.run_number }}"
          text = re.sub(r"const int kBuildNumber = \d+;", f"const int kBuildNumber = {build};", text)
          p.write_text(text)
          print(p.read_text())
          PY
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Verify APK is release-signed (not debug)
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS"/apksigner verify --print-certs "$APK" | tee /tmp/certs.txt
          if grep -q "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::APK signed with debug certificate — updates would fail"
            exit 1
          fi
          if ! grep -q "CN=SecuredView" /tmp/certs.txt; then
            echo "::error::APK not signed with SecuredView release certificate"
            exit 1
          fi
          echo "Release signature OK"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  release:
    needs: [build-linux, build-windows, build-android]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package Linux
        run: |
          cd artifacts/linux-build
          # actions/download-artifact strips exec bits — restore on top-level
          # files (launcher `securedview` etc.) or the tarball won't run.
          find . -maxdepth 1 -type f -exec chmod +x {} +
          tar czf ../../SecuredView-Linux.tar.gz .

      - name: Package Windows
        run: |
          # Flatten: artifact keeps build/windows/x64/runner/Release/... paths
          mkdir -p pkg-windows
          cp -a artifacts/windows-build/build/windows/x64/runner/Release/. pkg-windows/
          cp -f artifacts/windows-build/vc_redist.x64.exe pkg-windows/ 2>/dev/null || true
          cd pkg-windows
          echo "SecuredView VPN - Windows Build" > README.txt
          echo "" >> README.txt
          echo "1. Install vc_redist.x64.exe if you haven't already" >> README.txt
          echo "2. Run securedview.exe (Administrator — required for MASQUE TUN)" >> README.txt
          echo "3. usque.exe is the Cloudflare WARP MASQUE engine (bundled)" >> README.txt
          echo "4. Internet: uses the public API tunnel; create account / subscribe in-app" >> README.txt
          ls -la
          test -f securedview.exe
          test -f usque.exe
          zip -r ../SecuredView-Windows.zip .
          unzip -l ../SecuredView-Windows.zip | head -40

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            SecuredView-Linux.tar.gz
            SecuredView-Windows.zip
            artifacts/android-apk/app-release.apk
          generate_release_notes: true
